name: Makefile CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
env:
  ENV: base_raspberrypi_bcm27xx_bcm2709

jobs:
  init-openwrt:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - run: df -h
      # If brakes setup this: https://github.com/marketplace/actions/maximize-build-disk-space
      - name: "storage-cleanup"
        run: |
          sudo docker rmi $(docker image ls -aq) >/dev/null 2>&1 || true
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/lib/jvm || true
          echo "some directories deleted"
          sudo apt install aptitude -y >/dev/null 2>&1
          sudo aptitude purge aria2 ansible azure-cli shellcheck rpm xorriso zsync \
            esl-erlang firefox gfortran-8 gfortran-9 google-chrome-stable \
            google-cloud-sdk imagemagick \
            libmagickcore-dev libmagickwand-dev libmagic-dev ant ant-optional kubectl \
            mercurial apt-transport-https mono-complete libmysqlclient \
            unixodbc-dev yarn chrpath libssl-dev libxft-dev \
            libfreetype6 libfreetype6-dev libfontconfig1 libfontconfig1-dev \
            snmp pollinate libpq-dev postgresql-client powershell ruby-full \
            sphinxsearch subversion mongodb-org azure-cli microsoft-edge-stable \
            -y -f >/dev/null 2>&1
          sudo aptitude purge google-cloud-sdk -f -y >/dev/null 2>&1
          sudo aptitude purge microsoft-edge-stable -f -y >/dev/null 2>&1 || true
          sudo apt purge microsoft-edge-stable -f -y >/dev/null 2>&1 || true
          sudo aptitude purge '~n ^mysql' -f -y >/dev/null 2>&1
          sudo aptitude purge '~n ^php' -f -y >/dev/null 2>&1
          sudo aptitude purge '~n ^dotnet' -f -y >/dev/null 2>&1
          sudo apt-get autoremove -y >/dev/null 2>&1
          sudo apt-get autoclean -y >/dev/null 2>&1
          echo "some packages purged"
      - run: df -h

      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true # Initialize and update submodules

      - name: Cache OpenWrt Build
        uses: actions/cache@v4
        with:
          path: |
            openwrt/build_dir
          key: ${{ runner.os }}-openwrt-${{ hashFiles('**/conf/.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-


      # Ensure necessary directories exist and set permissions
      - name: Prepare OpenWrt directories
        run: |
          mkdir -p openwrt
          chmod -R 777 .
          

      - name: Make init
        run: |
          make init

      # Copy feeds.conf.default to the openwrt directory
      - name: Switching config to base_raspberrypi_bcm27xx_bcm2709
        run: |
          docker compose run --rm --user $(id -u):$(id -g) chirpstack-gateway-os make switch-env ENV=base_raspberrypi_bcm27xx_bcm2709


    
      # # Copy feeds.conf.default to the openwrt directory
      # - name: Copy feeds.conf.default
      #   run: cp feeds.conf.default openwrt/feeds.conf.default
      - name: Build OpenWrt
        run: |
          docker compose run --rm chirpstack-gateway-os bash -c "cd openwrt && make defconfig -j$(nproc)"
          docker compose run --rm chirpstack-gateway-os bash -c "cd openwrt &&  make download -j$(nproc) V=s"
          docker compose run --rm chirpstack-gateway-os bash -c "make -j$(nproc) V=s"

      # - name: Switching config to  full_raspberrypi_bcm27xx_bcm2709
      #   run: |
      #     docker compose run --rm --user $(id -u):$(id -g) chirpstack-gateway-os make switch-env ENV=full_raspberrypi_bcm27xx_bcm2709

      # - name: Build OpenWrt
      #   run: |
      #     docker compose run --rm chirpstack-gateway-os bash -c "cd openwrt && make defconfig -j$(nproc)"
      #     docker compose run --rm chirpstack-gateway-os bash -c "cd openwrt &&  make download -j$(nproc) V=s"
      #     docker compose run --rm chirpstack-gateway-os bash -c "make -j$(nproc) V=s"

      # List contents of targets folder and all subfolders
      - name: List OpenWrt build output (targets)
        run: |
          ls -lR openwrt/bin/targets
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image files
          path: openwrt/bin/targets/bcm27xx/bcm2709/chirpstack-gateway-os-*.gz

